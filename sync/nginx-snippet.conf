# Only needed if you keep your own nginx config instead of nginx/darkdev.boo.conf.
# Add inside the darkdev.boo server { } block, then: nginx -t && systemctl reload nginx

location ^~ /sync/ { deny all; return 404; }

# auto-discovery of /projects/*.html
location = /api/projects/ {
    alias /var/www/folder1/projects/;
    autoindex on;
    autoindex_format json;
    add_header Cache-Control "no-store";
}

# [sync] button
location = /api/sync {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8765/sync;
    proxy_read_timeout 30s;
    # auth_basic "sync";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
