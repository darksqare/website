# darkdev.boo - nginx server block
# Copy to /etc/nginx/conf.d/darkdev.boo.conf (or sites-available + symlink),
# then: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name darkdev.boo www.darkdev.boo;

    root /var/www/folder1;
    index index.html;

    # HTTPS: run `certbot --nginx -d darkdev.boo -d www.darkdev.boo`
    # and certbot will add the 443 block + http->https redirect for you.

    # --- redirects (edit redirects.conf) ---
    include /var/www/folder1/nginx/redirects.conf;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # never serve config / service files to visitors
    location ^~ /nginx/ { deny all; return 404; }
    location ^~ /sync/  { deny all; return 404; }

    # projects page: auto-discovers the .html files in /projects/
    location = /api/projects/ {
        alias /var/www/folder1/projects/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }

    # projects page: [sync] button -> local sync service (see sync/)
    location = /api/sync {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765/sync;
        proxy_read_timeout 30s;

        # optional: password-protect the button
        # auth_basic "sync";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # static asset caching
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # basic hardening
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
