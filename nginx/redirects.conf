# Redirects for darkdev.boo - edit the targets yourself.
# This file is included inside the server { } block.
# Use 302 while testing, change to 301 once you're happy (301s get cached by browsers).

# --- short links to your services / profiles ---
location = /gh       { return 302 https://github.com/darksqare; }
location = /github   { return 302 https://github.com/darksqare; }
location = /tiktok   { return 302 https://www.tiktok.com/@._.v1ncee; }
location = /files    { return 302 https://fb.darkdev.boo; }
location = /mc       { return 302 https://crafty.darkdev.boo; }
location = /crafty   { return 302 https://crafty.darkdev.boo; }
location = /pve      { return 302 https://pve.darkdev.boo; }
location = /proxmox  { return 302 https://pve.darkdev.boo; }
location = /ha       { return 302 https://ha.darkdev.boo; }
location = /friend   { return 302 https://implodium.dev; }

# --- internal page aliases ---
# NOTE: must be an `if` on $request_uri (the URL the visitor typed). A
# `location = /index.html` rule loops forever, because nginx serves "/" by
# internally jumping to /index.html.
if ($request_uri ~ ^/index\.html(\?.*)?$) { return 301 /; }
location = /links      { return 301 /; }
location = /home       { return 301 /; }

# --- optional: strip .html from URLs (clean URLs) ---
# Pages already link to .html, so this is off by default.
# rewrite ^/(.+)\.html$ /$1 permanent;
